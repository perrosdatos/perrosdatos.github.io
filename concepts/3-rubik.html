<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cube Résumé — Juan Carlos González</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{--w:#f5f5f0;--r:#d7263d;--y:#ffd23f;--o:#ff7f11;--b:#1b65d6;--g:#16a34a;--ink:#141414;--bg:#ecebe4;--card:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15151a;--ink:#f1f1ee;--card:#1f1f26}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,sans-serif;overflow:hidden;height:100vh}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.brand{position:fixed;top:24px;left:28px;z-index:2;pointer-events:none}
.brand h1{font-weight:900;font-size:clamp(26px,4vw,48px);line-height:.95;letter-spacing:-.02em}
.brand p{margin-top:8px;opacity:.7;font-size:14px}
.tiles{position:fixed;left:28px;bottom:28px;z-index:2;display:grid;grid-template-columns:repeat(3,64px);gap:6px;padding:8px;background:#141414;border-radius:12px}
.tiles button{height:64px;border:0;border-radius:8px;font:600 10px Rubik;letter-spacing:.06em;cursor:pointer;color:#141414;transition:transform .15s}
.tiles button:hover{transform:scale(1.07)}
.tiles button.on{outline:3px solid #fff;outline-offset:-6px}
.ctrl{position:fixed;right:28px;bottom:28px;z-index:2;display:flex;gap:8px}
.ctrl button{font:600 13px Rubik;padding:12px 18px;border-radius:999px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer}
.ctrl button:hover{background:var(--ink);color:var(--bg)}
.panel{position:fixed;top:24px;right:24px;bottom:96px;width:min(420px,calc(100vw - 48px));z-index:2;background:var(--card);border-radius:20px;padding:28px;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.18);transform:translateX(120%);transition:transform .5s cubic-bezier(.2,.9,.2,1)}
.panel.open{transform:none}
.panel .x{position:absolute;top:16px;right:16px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--ink)}
.panel .chip{display:inline-block;width:28px;height:28px;border-radius:6px;vertical-align:middle;margin-right:10px}
.panel h2{font-weight:900;font-size:30px;margin-bottom:18px}
.panel p{line-height:1.6;opacity:.85;margin-bottom:12px}
.tl{border-left:3px solid currentColor;padding-left:18px}
.tl div{position:relative;margin-bottom:18px}
.tl div::before{content:"";position:absolute;left:-26px;top:4px;width:13px;height:13px;border-radius:3px;background:var(--c)}
.tl b{display:block;font-weight:900}.tl small{opacity:.6}
.sk span{display:inline-block;padding:7px 12px;margin:0 6px 8px 0;border-radius:8px;background:var(--bg);font-size:14px}
.pj{border:2px solid var(--bg);border-radius:12px;padding:14px;margin-bottom:12px;display:block;color:inherit;text-decoration:none}
.pj:hover{border-color:var(--c)}
.pj b{display:block;margin-bottom:4px}.pj small{opacity:.7}
.ct a{display:block;font-size:18px;font-weight:600;color:var(--ink);margin:10px 0}
.hint{position:fixed;left:50%;top:24px;transform:translateX(-50%);z-index:2;font-size:13px;opacity:.55;pointer-events:none}
@media (max-width:700px){.panel{top:auto;height:55vh;bottom:0;right:0;width:100%;border-radius:20px 20px 0 0;transform:translateY(110%)}.tiles{grid-template-columns:repeat(6,1fr);left:12px;right:12px;bottom:12px}.tiles button{height:46px;font-size:8px}.ctrl{top:24px;bottom:auto;right:16px}.ctrl button{padding:8px 12px;font-size:11px}.hint{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="brand"><h1>Juan Carlos<br>González</h1><p>Applied AI Lead · ML Engineer · Malmö</p></div>
<div class="hint">drag to spin · click a face to open it</div>
<div class="tiles" id="tiles"></div>
<div class="ctrl"><button id="scr">Scramble</button><button id="sol">Solve</button></div>
<aside class="panel" id="panel"><button class="x" id="cls">✕</button><div id="pc"></div></aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const M=[
 ['2011','RoboCup Istanbul & State Youth Award','Mexico'],['2012','UNAM · BSc Applied Math & Computing (honors)','Mexico City'],
 ['2014','1st Mexican Robotics Tournament · LatAm Robotics','Mexico / Brazil'],['2016','MTEXPERTS · Data Scientist','Mexico City'],
 ['2017','BBVA · Senior Data Scientist — €350M in loans','Mexico City'],['2022','SESOL · Lead Data Scientist — €600K+/yr savings','Jönköping'],
 ['2024','MSc AI Engineering · Jönköping University','Jönköping'],['2025','Apple · ML Engineer (via AFRY)','Malmö']];
const FACES=[ // axis, sign, colour, label
 {k:'about',ax:'z',s:1,col:'#f5f5f0',name:'About'},
 {k:'journey',ax:'x',s:1,col:'#d7263d',name:'Journey'},
 {k:'skills',ax:'y',s:1,col:'#ffd23f',name:'Skills'},
 {k:'projects',ax:'x',s:-1,col:'#ff7f11',name:'Projects'},
 {k:'awards',ax:'z',s:-1,col:'#1b65d6',name:'Awards'},
 {k:'contact',ax:'y',s:-1,col:'#16a34a',name:'Contact'}];
const HTML={
 about:`<p>Applied AI Lead and ML Engineer with 9+ years shipping LLM platforms, AI agents and ML models into production in finance and energy.</p><p>Applied mathematician from UNAM, MSc in AI Engineering from Jönköping University, former robotics competitor. Currently ML Engineer at Apple through AFRY.</p><p>I like problems that look like a scrambled cube: many moving parts, one clean solution.</p>`,
 journey:`<div class="tl">${M.map(m=>`<div><small>${m[0]} · ${m[2]}</small><b>${m[1]}</b></div>`).join('')}</div>`,
 skills:`<div class="sk">${['Python','JAX','PyTorch','TensorFlow','LLMs','RAG','LangGraph','AI Agents','MCP','Fine-tuning','NLP','Reinforcement Learning','Graph inference','Computer vision','Spark','SQL','AWS SageMaker','Databricks','Kubeflow','Docker','CI/CD','Airflow','Team leadership','Product vision'].map(s=>`<span>${s}</span>`).join('')}</div>`,
 projects:[['Lux AI S3 · Multi-agent RL','MAPPO, QMIX, MASAC + custom JAX wrapper (thesis, 2026)'],['DFS OCR Reader','YOLOv5 + Tesseract + BERT over federal security archives','https://github.com/perrosdatos/files_dfs_ocr_reader'],['Semantic music recommender','Metaheuristics + YAGO/Wikidata','https://github.com/perrosdatos/msc_ai_kw_project'],['Genetic algorithm for the TSP','Near-optimal tours vs branch-and-bound'],['Intro to Spark workshop','Hands-on teaching material','https://github.com/perrosdatos/fast_introduction_to_spark']].map(p=>`<a class="pj" ${p[2]?`href="${p[2]}"`:''}><b>${p[0]}</b><small>${p[1]}</small></a>`).join(''),
 awards:`<div class="tl">${[['2020–21','Two-time winner, BBVA internal datathon'],['2014','1st place, Mexican Robotics Tournament (IEEE)'],['2014','Latin American Robotics Competition, Brazil'],['2014','2nd place, MAC programming contest, UNAM'],['2013','1st place, programming contest, FES Acatlán'],['2012','1st place, PUMATRON-UNAM'],['2011–12','RoboCup Istanbul & Mexico'],['2011','State Youth Award, technological innovation']].map(a=>`<div><small>${a[0]}</small><b>${a[1]}</b></div>`).join('')}</div>`,
 contact:`<div class="ct"><a href="mailto:carlosgonzagular@gmail.com">carlosgonzagular@gmail.com</a><a href="https://www.github.com/perrosdatos">github.com/perrosdatos</a><a href="https://www.linkedin.com/in/juancarlosgonzalezaguilar/">LinkedIn</a></div>`};

// ---------- scene ----------
const R=new THREE.WebGLRenderer({canvas:c,antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(38,1,.1,100);cam.position.set(0,1.2,11);cam.lookAt(0,-.3,0);
scene.add(new THREE.HemisphereLight(0xffffff,0x888877,.9));
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(4,8,6);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.ShadowMaterial({opacity:.18}));floor.rotation.x=-Math.PI/2;floor.position.y=-2.8;floor.receiveShadow=true;scene.add(floor);

const root=new THREE.Group();scene.add(root); // whole-cube orientation
const cube=new THREE.Group();root.add(cube);
function stickerTex(col,label){const s=256,cv=document.createElement('canvas');cv.width=cv.height=s;const x=cv.getContext('2d');
  x.fillStyle='#111';x.fillRect(0,0,s,s);x.fillStyle=col;const r=40,p=14;x.beginPath();x.moveTo(p+r,p);x.arcTo(s-p,p,s-p,s-p,r);x.arcTo(s-p,s-p,p,s-p,r);x.arcTo(p,s-p,p,p,r);x.arcTo(p,p,s-p,p,r);x.fill();
  const g=x.createLinearGradient(0,0,s,s);g.addColorStop(0,'rgba(255,255,255,.25)');g.addColorStop(.5,'rgba(255,255,255,0)');x.fillStyle=g;x.fill();
  if(label){x.fillStyle=col==='#f5f5f0'||col==='#ffd23f'?'#141414':'#fff';x.font='900 40px Rubik, sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(label.toUpperCase(),s/2,s/2)}
  const t=new THREE.CanvasTexture(cv);t.anisotropy=4;return t}
const bodyMat=new THREE.MeshStandardMaterial({color:0x111111,roughness:.35});
const plainMat={};FACES.forEach(f=>plainMat[f.k]=new THREE.MeshStandardMaterial({map:stickerTex(f.col),roughness:.3}));
const cubies=[];
for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++)for(let k=-1;k<=1;k++){
  const cb=new THREE.Mesh(new THREE.BoxGeometry(.98,.98,.98),bodyMat);cb.position.set(i,j,k);cb.castShadow=true;cube.add(cb);cubies.push(cb);
  FACES.forEach(f=>{const v={x:i,y:j,z:k};if(v[f.ax]!==f.s)return;
    const isCenter=['x','y','z'].filter(a=>a!==f.ax).every(a=>v[a]===0);
    const m=isCenter?new THREE.MeshStandardMaterial({map:stickerTex(f.col,f.name),roughness:.3}):plainMat[f.k];
    const st=new THREE.Mesh(new THREE.PlaneGeometry(.94,.94),m);
    const n=new THREE.Vector3();n[f.ax]=f.s;st.position.copy(n).multiplyScalar(.495);st.lookAt(n.clone().multiplyScalar(2));
    st.userData.sticker=true;cb.add(st)})}

// ---------- voxel runner ----------
function makeRunner(){const g=new THREE.Group(),b=new THREE.Group();g.add(b);
  const box=(w,h,d,c,p)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.6}));m.castShadow=true;p.add(m);return m};
  box(.5,.6,.3,0xd7263d,b).position.y=1.2;box(.42,.42,.42,0xc68b59,b).position.y=1.75;box(.46,.14,.46,0x2b1a10,b).position.y=1.98;
  const eye=(x)=>{const e=box(.06,.06,.02,0x111111,b);e.position.set(x,1.78,.215)};eye(-.09);eye(.09);
  const limb=(w,h,c,x,y)=>{const p=new THREE.Group();p.position.set(x,y,0);box(w,h,w,c,p).position.y=-h/2;b.add(p);return p};
  const aL=limb(.14,.55,0xd7263d,-.33,1.48),aR=limb(.14,.55,0xd7263d,.33,1.48),lL=limb(.18,.9,0x1b65d6,-.13,.9),lR=limb(.18,.9,0x1b65d6,.13,.9);
  g.tick=(t,s,wave)=>{const a=Math.sin(t*9);aL.rotation.x=a*s;lL.rotation.x=-a*.8*s;lR.rotation.x=a*.8*s;
    aR.rotation.x=wave?0:-a*s;aR.rotation.z=wave?2.6+Math.sin(t*10)*.3:0;b.position.y=Math.abs(Math.cos(t*9))*.08*s};
  g.scale.setScalar(.75);return g}
const boy=makeRunner();boy.position.y=-2.8;scene.add(boy);

// ---------- twists ----------
let busy=false,history=[],queue=[];
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function twist(ax,layer,dir,dur=260){return new Promise(res=>{
  const piv=new THREE.Object3D();cube.add(piv);const sel=cubies.filter(cb=>Math.round(cb.position[ax])===layer);sel.forEach(cb=>piv.attach(cb));
  const t0=performance.now();boyHop=1;
  (function step(now){const p=Math.min(1,(now-t0)/dur);piv.rotation[ax]=dir*Math.PI/2*ease(p);
    if(p<1)return requestAnimationFrame(step);
    sel.forEach(cb=>{cube.attach(cb);cb.updateMatrix();const e=cb.matrix.elements;[0,1,2,4,5,6,8,9,10,12,13,14].forEach(i=>e[i]=Math.round(e[i]));cb.matrix.decompose(cb.position,cb.quaternion,cb.scale)});
    cube.remove(piv);res()})(t0)})}
async function run(moves,dur){busy=true;for(const m of moves)await twist(...m,dur);busy=false}
function scramble(n=14){if(busy)return;const mv=[];for(let i=0;i<n;i++){mv.push(['xyz'[Math.random()*3|0],Math.random()<.5?-1:1,Math.random()<.5?-1:1])}history.push(...mv);return run(mv,200)}
function solve(){if(busy)return;const mv=history.reverse().map(m=>[m[0],m[1],-m[2]]);history=[];return run(mv,170)}
scr.onclick=()=>scramble();sol.onclick=()=>solve();

// ---------- orientation / selection ----------
const tilt=new THREE.Quaternion().setFromEuler(new THREE.Euler(.42,-.62,0));
const faceQ={about:[0,0,0],journey:[0,-Math.PI/2,0],skills:[Math.PI/2,0,0],projects:[0,Math.PI/2,0],awards:[0,Math.PI,0],contact:[-Math.PI/2,0,0]};
let targetQ=tilt.clone(),current=null,boyHop=0;
function open(k){current=k;const f=FACES.find(f=>f.k===k);
  targetQ=new THREE.Quaternion().setFromEuler(new THREE.Euler(.25,-.35,0)).multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(...faceQ[k])));
  pc.innerHTML=`<h2><span class="chip" style="background:${f.col};box-shadow:inset 0 0 0 2px #0002"></span>${f.name}</h2>${HTML[k]}`;pc.style.setProperty('--c',f.col);
  pc.querySelectorAll('.tl').forEach(e=>e.style.setProperty('--c',f.col));
  panel.classList.add('open');document.querySelectorAll('.tiles button').forEach(b=>b.classList.toggle('on',b.dataset.k===k))}
cls.onclick=()=>{panel.classList.remove('open');current=null;targetQ=tilt.clone();document.querySelectorAll('.tiles button').forEach(b=>b.classList.remove('on'))};
tiles.innerHTML=FACES.map(f=>`<button data-k="${f.k}" style="background:${f.col}">${f.name.toUpperCase()}</button>`).join('');
tiles.onclick=e=>{const k=e.target.dataset.k;if(k)open(k)};

// drag + click picking
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let drag=null,moved=0,vel={x:0,y:0};
c.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};moved=0;c.setPointerCapture(e.pointerId)};
c.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag={x:e.clientX,y:e.clientY};moved+=Math.abs(dx)+Math.abs(dy);
  vel={x:dx*.008,y:dy*.008};spin(vel.x,vel.y)};
c.onpointerup=e=>{drag=null;if(moved<6)pick(e);else targetQ=null};
function spin(dx,dy){const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(dy,dx,0));root.quaternion.premultiply(q)}
function pick(e){ptr.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(ptr,cam);
  const hit=ray.intersectObjects(cube.children,true).find(h=>h.object.userData.sticker);if(!hit)return;
  const n=new THREE.Vector3(0,0,1).transformDirection(hit.object.matrixWorld).applyQuaternion(root.quaternion.clone().invert());
  const ax=['x','y','z'].reduce((a,b)=>Math.abs(n[b])>Math.abs(n[a])?b:a),s=Math.sign(n[ax]);
  open(FACES.find(f=>f.ax===ax&&f.s===s).k)}

// ---------- loop ----------
function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.position.z=innerWidth<700?15:11;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
root.quaternion.copy(tilt);
let t=0,last=performance.now(),ang=0;
(function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
  if(!drag){if(targetQ)root.quaternion.slerp(targetQ,Math.min(1,dt*4));else{vel.x*=.95;vel.y*=.95;spin(vel.x,vel.y)}}
  // boy jogs around the cube; when a face is open he stops in front and waves
  const goal=current?.85:null;
  if(current){ang+=(((goal-ang)%(2*Math.PI)+3*Math.PI)%(2*Math.PI)-Math.PI)*dt*2}else ang+=dt*.45;
  const moving=!current||Math.abs(((goal-ang)%(2*Math.PI)+3*Math.PI)%(2*Math.PI)-Math.PI)>.05;
  boy.position.x=Math.sin(ang)*3.1;boy.position.z=Math.cos(ang)*3.1;
  boy.rotation.y=moving&&!current?ang+Math.PI/2:Math.atan2(cam.position.x-boy.position.x,cam.position.z-boy.position.z);
  boyHop=Math.max(0,boyHop-dt*3);boy.position.y=-2.8+Math.sin(boyHop*Math.PI)*.35;
  boy.tick(t,moving?1:0,!moving);
  R.render(scene,cam);requestAnimationFrame(loop)})(last);
// intro: scramble then solve
setTimeout(async()=>{await scramble(10);setTimeout(solve,400)},700);
</script>
</body>
</html>
