<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Quest — Juan Carlos González</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a1c2c;--ink:#f4f4f4;--y:#ffcd75;--r:#b13e53;--g:#38b764;--b:#41a6f6;--p:#5d275d;--dk:#333c57}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Press Start 2P',monospace;font-size:12px;line-height:1.8}
header{text-align:center;padding:28px 16px 18px}
header h1{font-size:clamp(16px,3.4vw,30px);color:var(--y);text-shadow:4px 4px 0 var(--r)}
header p{margin-top:12px;color:#94b0c2;font-size:10px}
.stage{position:relative;max-width:1100px;margin:0 auto;border:4px solid #000;box-shadow:0 0 0 4px var(--ink),8px 8px 0 4px #000}
canvas{display:block;width:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
.dlg{position:absolute;left:3%;right:3%;bottom:4%;background:#000c;border:4px solid var(--ink);padding:12px 14px;font-size:clamp(8px,1.2vw,12px);display:none}
.dlg b{color:var(--y)}
.dlg .pl{color:var(--b);font-size:.8em}
.hint{position:absolute;top:8px;left:10px;font-size:clamp(7px,1vw,10px);text-shadow:2px 2px 0 #000}
.score{position:absolute;top:8px;right:10px;font-size:clamp(7px,1vw,10px);text-shadow:2px 2px 0 #000;color:var(--y)}
.pad{display:flex;justify-content:center;gap:10px;margin:18px 0}
button{font:inherit;font-size:11px;background:var(--dk);color:var(--ink);border:3px solid var(--ink);padding:10px 14px;cursor:pointer;box-shadow:4px 4px 0 #000;user-select:none;touch-action:manipulation}
button:active,button.on{transform:translate(3px,3px);box-shadow:1px 1px 0 #000;background:var(--r)}
section{max-width:1100px;margin:60px auto;padding:0 16px}
h2{color:var(--g);font-size:18px;margin-bottom:24px}
h2::before{content:"▶ ";color:var(--y)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px 40px;border:4px solid var(--ink);padding:20px;background:var(--dk)}
.stat{display:flex;align-items:center;gap:10px;font-size:10px}
.stat span{width:150px;flex:none}
.stat .bar{flex:1;height:14px;background:#000;border:2px solid var(--ink);display:flex;gap:2px;padding:1px}
.stat .bar i{flex:1;background:#000}
.stat .bar i.f{background:var(--g)}
.stat em{font-style:normal;color:var(--y);width:28px;text-align:right}
.inv{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.cart{background:#5a6988;border:4px solid #000;padding:10px;box-shadow:6px 6px 0 #000;transition:transform .1s;color:inherit;text-decoration:none;display:block}
.cart:hover{transform:translate(-3px,-3px) rotate(-1deg)}
.cart .lbl{background:var(--ink);color:#000;padding:12px;min-height:150px;border:3px solid #000}
.cart .lbl h3{font-size:11px;color:var(--r);margin-bottom:8px}
.cart .lbl p{font-size:8px;line-height:1.7}
.cart .ridge{height:10px;margin-top:8px;background:repeating-linear-gradient(90deg,#333c57 0 6px,transparent 6px 10px)}
.ach{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.ach div{border:3px solid var(--y);padding:10px;font-size:9px;display:flex;gap:10px;align-items:center;background:#000}
.ach div::before{content:"🏆";font-size:18px}
footer{text-align:center;padding:60px 16px}
footer a{color:var(--b);display:block;margin:10px}
.blink{animation:b 1s steps(1) infinite;color:var(--y);font-size:16px;margin-bottom:20px}@keyframes b{50%{opacity:0}}
</style>
</head>
<body>
<header>
  <h1>JUAN CARLOS GONZÁLEZ</h1>
  <p>WORLD 1-1 · FROM MEXICO CITY TO MALMÖ</p>
</header>

<div class="stage">
  <canvas id="c" width="320" height="180"></canvas>
  <div class="hint" id="hint">← → MOVE · SPACE JUMP · HIT THE ? BLOCKS</div>
  <div class="score" id="score">★ 0/8</div>
  <div class="dlg" id="dlg"></div>
</div>
<div class="pad">
  <button id="bl">◀</button><button id="bj">JUMP</button><button id="br">▶</button><button id="ba">AUTO-PLAY</button>
</div>

<section>
  <h2>CHARACTER STATS</h2>
  <div class="stats" id="stats"></div>
</section>
<section>
  <h2>INVENTORY · PROJECTS</h2>
  <div class="inv" id="inv"></div>
</section>
<section>
  <h2>ACHIEVEMENTS UNLOCKED</h2>
  <div class="ach" id="ach"></div>
</section>
<footer>
  <div class="blink">PRESS START TO CONTACT</div>
  <a href="mailto:carlosgonzagular@gmail.com">carlosgonzagular@gmail.com</a>
  <a href="https://www.github.com/perrosdatos">github/perrosdatos</a>
  <a href="https://www.linkedin.com/in/juancarlosgonzalezaguilar/">linkedin</a>
</footer>

<script>
const M=[
 {y:'2011',place:'MEXICO → ISTANBUL',t:'RoboCup & State Youth Award',d:'First robots, first trip abroad, first award for technological innovation.'},
 {y:'2012',place:'CDMX',t:'UNAM · Applied Math & Computing',d:'1st place PUMATRON, programming contests, graduated with honors.'},
 {y:'2014',place:'CDMX → BRAZIL',t:'Robotics champion',d:'1st place Mexican Robotics Tournament (IEEE) + Latin American Robotics Competition.'},
 {y:'2016',place:'CDMX',t:'MTEXPERTS · Data Scientist',d:'Queue prediction models: +10% service efficiency. Won a SAS scholarship.'},
 {y:'2017',place:'CDMX',t:'BBVA · Senior Data Scientist',d:'€350M in loans via graph + NLP risk models. 22M accounts. 2× datathon winner.'},
 {y:'2022',place:'JÖNKÖPING, SE',t:'SESOL · Lead Data Scientist',d:'New world unlocked: Sweden! Led 8+ people, €600K+ yearly savings with AI agents.'},
 {y:'2024',place:'JÖNKÖPING, SE',t:'MSc AI Engineering',d:'Side quest: multi-agent RL thesis with JAX on Lux AI S3.'},
 {y:'2025',place:'MALMÖ, SE',t:'Apple · ML Engineer (via AFRY)',d:'Current level. Details are a secret (NDA).'}];
const S=[['PYTHON',10],['LLM · RAG · AGENTS',9],['PYTORCH · TF',9],['JAX',8],['MLOPS · AWS',8],['SPARK · SQL',9],['REINFORCEMENT L.',8],['LEADERSHIP',9]];
const P=[
 {n:'LUX AI S3 MARL',d:'Multi-agent RL thesis. MAPPO, QMIX, MASAC + custom JAX wrapper.'},
 {n:'DFS OCR READER',d:'YOLOv5 + Tesseract + BERT over federal security archives.',url:'https://github.com/perrosdatos/files_dfs_ocr_reader'},
 {n:'SEMANTIC MUSIC',d:'Metaheuristics + YAGO/Wikidata music recommender.',url:'https://github.com/perrosdatos/msc_ai_kw_project'},
 {n:'GA vs TSP',d:'Genetic algorithm beats branch-and-bound on cost.'}];
const A=['2× WINNER BBVA DATATHON','1ST MEXICAN ROBOTICS TOURNAMENT','LATAM ROBOTICS · BRAZIL','2ND MAC PROGRAMMING · UNAM','1ST PUMATRON-UNAM','ROBOCUP ISTANBUL & MEXICO','STATE YOUTH AWARD 2011'];
stats.innerHTML=S.map(s=>`<div class="stat"><span>${s[0]}</span><div class="bar">${Array.from({length:10},(_,i)=>`<i class="${i<s[1]?'f':''}"></i>`).join('')}</div><em>${s[1]*10}</em></div>`).join('');
inv.innerHTML=P.map(p=>`<a class="cart" ${p.url?`href="${p.url}"`:''}><div class="lbl"><h3>${p.n}</h3><p>${p.d}</p></div><div class="ridge"></div></a>`).join('');
ach.innerHTML=A.map(a=>`<div>${a}</div>`).join('');

// ---------- game ----------
const cv=c,x=cv.getContext('2d');x.imageSmoothingEnabled=false;
const W=320,H=180,GY=148,BX=i=>180+i*240,SWX=(BX(4)+BX(5))/2,END=BX(7)+260;
const SPR={
 idle:["....HHHHH...","...HHHHHHH..","...HHSSKS...","...HSSSSSS..","....SSSSS...",".....SSS....","...RRRRRR...","..RRRRRRRR..","..SRRRRRRS..","..SRRRRRRS..","....BBBB....","....BBBB....","....BB.BB...","....BB.BB...","...WWW.WWW..","............"],
 r1:["....HHHHH...","...HHHHHHH..","...HHSSKS...","...HSSSSSS..","....SSSSS...",".....SSS....","...RRRRRR...",".SRRRRRRRR..","....RRRRRRS.","....RRRR....","....BBBB....","...BBB.BB...","..BB....BB..",".BB......BB.",".WW......WW.","............"],
 r2:["............","....HHHHH...","...HHHHHHH..","...HHSSKS...","...HSSSSSS..","....SSSSS...",".....SSS....","...RRRRRR...","...SRRRRRS..","....RRRR....","....BBBB....","....BBBB....",".....BBB....",".....BB.....","....WWW.....","............"]};
const PAL={H:'#3b2414',S:'#c68b59',K:'#000',R:'#b13e53',B:'#3b5dc9',W:'#f4f4f4'};
function spr(f,px,py,flip,shirt){f.forEach((row,j)=>{for(let i=0;i<12;i++){const ch=row[i];if(ch==='.')continue;
  x.fillStyle=ch==='R'?shirt:PAL[ch];x.fillRect(px+(flip?11-i:i),py+j,1,1)}})}
const pl={x:40,y:GY,vy:0,on:true,face:1,t:0};
const blocks=M.map((m,i)=>({x:BX(i),y:100,hit:false,bump:0}));
let coins=[],keys={},auto=false,autoWait=0,got=0,snow=[];
for(let i=0;i<70;i++)snow.push({x:Math.random()*W,y:Math.random()*H,s:.2+Math.random()*.5});
const lerp=(a,b,t)=>a+(b-a)*t,hex=h=>typeof h==='string'?[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)):h;
const mixA=(a,b,t)=>{a=hex(a);b=hex(b);return a.map((v,i)=>Math.round(lerp(v,b[i],t)))};
const mix=(a,b,t)=>`rgb(${mixA(a,b,t).join(',')})`;
const sm=(e0,e1,v)=>{const t=Math.max(0,Math.min(1,(v-e0)/(e1-e0)));return t*t*(3-2*t)};
const rnd=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)};

addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','a','d','w','ArrowUp'].includes(e.key)){keys[e.key]=1;auto=false;ba.classList.remove('on');if(document.activeElement.tagName!=='BUTTON'&&e.key===' ')e.preventDefault()}});
addEventListener('keyup',e=>keys[e.key]=0);
const hold=(el,k)=>{el.onpointerdown=()=>{keys[k]=1;auto=false;ba.classList.remove('on')};el.onpointerup=el.onpointerleave=()=>keys[k]=0};
hold(bl,'ArrowLeft');hold(br,'ArrowRight');hold(bj,' ');
ba.onclick=()=>{auto=!auto;ba.classList.toggle('on',auto)};

function jump(){if(pl.on){pl.vy=-4.2;pl.on=false}}
function update(k){
  let dir=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);
  if(keys[' ']||keys.w||keys.ArrowUp)jump();
  if(auto){const nb=blocks.find(b=>!b.hit);
    if(autoWait>0){autoWait-=k;dir=0}
    else if(nb){if(Math.abs(pl.x-nb.x)<3){dir=0;jump()}else dir=Math.sign(nb.x-pl.x)}
    else dir=pl.x<END-40?1:0}
  pl.x=Math.max(8,Math.min(END,pl.x+dir*1.6*k));if(dir)pl.face=dir;
  pl.vy+=.22*k;pl.y+=pl.vy*k;
  if(pl.y>=GY){pl.y=GY;pl.vy=0;pl.on=true}
  blocks.forEach((b,i)=>{b.bump=Math.max(0,b.bump-k*.5);
    const head=pl.y-16;if(pl.vy<0&&head<b.y+16&&head>b.y+4&&Math.abs(pl.x-b.x)<11){pl.vy=1;
      b.bump=4;if(!b.hit){b.hit=true;got++;coins.push({x:b.x,y:b.y-6,v:-3,life:40});if(auto)autoWait=150}}});
  coins.forEach(c=>{c.y+=c.v*k;c.v+=.15*k;c.life-=k});coins=coins.filter(c=>c.life>0);
  pl.t+=dir&&pl.on?k:0;
}
function draw(){
  const cam=Math.round(Math.max(0,Math.min(END+40-W,pl.x-120)));
  const f=sm(SWX-160,SWX+160,cam+160);
  // sky bands
  for(let b=0;b<18;b++){const t=b/17;x.fillStyle=mix(mixA('#ff8a5c','#ffe0a0',t),mixA('#0b1033','#2a4a7a',t),f);x.fillRect(0,b*10,W,10)}
  // sun / aurora
  if(f<1){x.globalAlpha=1-f;x.fillStyle='#fff3b0';const sx=230-cam*.05;for(let r=14;r>0;r-=2){x.fillRect(sx-r,52-Math.round(Math.sqrt(196-r*r)),r*2,2*Math.round(Math.sqrt(196-r*r))||2)}x.globalAlpha=1}
  if(f>0){x.globalAlpha=f*.7;for(let i=0;i<W;i+=2){const h=Math.sin(i*.04+performance.now()/900)*8+Math.sin(i*.013)*10;
    x.fillStyle=i%6?'#38b764':'#73eff7';x.fillRect(i,30+h,2,14+Math.sin(i*.1)*4)}x.globalAlpha=1;
    x.fillStyle='#fff';for(let i=0;i<30;i++)x.fillRect(Math.floor(rnd(i)*W),Math.floor(rnd(i+9)*80),1,1)}
  // far layer: pyramids (MX) / mountains (SE)
  const p1=cam*.3;
  for(let wx=Math.floor(p1/90)*90-90;wx<p1+W+90;wx+=90){const sx=Math.round(wx-p1),se=(wx/.3)>SWX;
    if(!se){if(rnd(wx)>.4){for(let s=0;s<6;s++){x.fillStyle=s%2?'#a0522d':'#b8683a';const w=34-s*5;x.fillRect(sx+40-w,128-s*7,w*2,7)}x.fillStyle='#7a3b1e';x.fillRect(sx+38,86,4,42)}}
    else{x.fillStyle='#3b5d8a';for(let r=0;r<40;r++)x.fillRect(sx+45-r,96+r,r*2,1);x.fillStyle='#f4f4f4';for(let r=0;r<10;r++)x.fillRect(sx+45-r,96+r,r*2,1)}}
  // mid layer: cacti / pines
  const p2=cam*.6;
  for(let wx=Math.floor(p2/48)*48-48;wx<p2+W+48;wx+=48){if(rnd(wx+3)<.45)continue;const sx=Math.round(wx-p2),se=(wx/.6)>SWX;
    if(!se){x.fillStyle='#257179';x.fillRect(sx,124,5,24);x.fillRect(sx-5,132,5,3);x.fillRect(sx-5,126,3,8);x.fillRect(sx+5,128,5,3);x.fillRect(sx+8,122,3,9)}
    else{for(let r=0;r<26;r++){x.fillStyle=r%6<2?'#f4f4f4':'#1b4d3e';const w=Math.floor(r/2.2)+1;x.fillRect(sx-w,120+r,w*2+1,1)}x.fillStyle='#3b2414';x.fillRect(sx-1,146,3,4)}}
  // plane over the ocean
  const ps=SWX-cam-60+Math.sin(performance.now()/500)*2;if(ps>-40&&ps<W){x.fillStyle='#f4f4f4';x.fillRect(ps,40,26,5);x.fillRect(ps+8,34,6,16);x.fillRect(ps,36,3,5);x.fillStyle='#41a6f6';x.fillRect(ps+18,41,2,2);x.fillRect(ps+14,41,2,2)}
  // ground tiles
  for(let gx=Math.floor(cam/16)*16;gx<cam+W+16;gx+=16){const se=gx>SWX,sx=gx-cam;
    if(Math.abs(gx-SWX)<40){x.fillStyle='#29366f';x.fillRect(sx,GY+4,16,H);x.fillStyle='#41a6f6';x.fillRect(sx+((performance.now()/120|0)%8),GY+6,4,1);continue}
    x.fillStyle=se?'#566c86':'#a0522d';x.fillRect(sx,GY,16,H-GY);x.fillStyle=se?'#f4f4f4':'#e0a060';x.fillRect(sx,GY,16,4);
    x.fillStyle=se?'#333c57':'#7a3b1e';x.fillRect(sx+3,GY+9,2,2);x.fillRect(sx+11,GY+17,2,2);x.fillRect(sx,GY,1,H)}
  // finish house
  const hx=END-cam;x.fillStyle='#b13e53';x.fillRect(hx-20,GY-28,40,28);x.fillStyle='#f4f4f4';for(let r=0;r<14;r++)x.fillRect(hx-24+r,GY-28-r,48-r*2,1);x.fillStyle='#ffcd75';x.fillRect(hx-4,GY-14,8,14);
  x.fillStyle='#41a6f6';x.fillRect(hx+26,GY-50,14,9);x.fillStyle='#ffcd75';x.fillRect(hx+30,GY-50,2,9);x.fillRect(hx+26,GY-46,14,2);x.fillStyle='#000';x.fillRect(hx+25,GY-50,1,50);
  // blocks
  blocks.forEach((b,i)=>{const sx=b.x-cam-8,sy=b.y-Math.round(b.bump);if(sx<-20||sx>W)return;
    x.fillStyle='#000';x.fillRect(sx-1,sy-1,18,18);x.fillStyle=b.hit?'#8b5a2b':'#ffcd75';x.fillRect(sx,sy,16,16);
    x.fillStyle=b.hit?'#5a3a1a':'#ef7d57';x.fillRect(sx+1,sy+1,1,1);x.fillRect(sx+14,sy+1,1,1);x.fillRect(sx+1,sy+14,1,1);x.fillRect(sx+14,sy+14,1,1);
    if(!b.hit){x.fillStyle='#b13e53';x.fillRect(sx+5,sy+3,6,2);x.fillRect(sx+10,sy+5,2,3);x.fillRect(sx+7,sy+8,3,2);x.fillRect(sx+7,sy+12,3,2)}
    x.fillStyle='#1a1c2c';x.fillRect(sx-6,sy-13,28,10);x.font='8px "Press Start 2P"';x.fillStyle='#ffcd75';x.fillText("'"+M[i].y.slice(2),sx-4,sy-4)});
  coins.forEach(c=>{x.fillStyle='#ffcd75';x.fillRect(c.x-cam-3,c.y,6,8);x.fillStyle='#fff';x.fillRect(c.x-cam-1,c.y+2,1,4)});
  // player (shirt turns from red to blue in Sweden)
  const fr=!pl.on?SPR.r1:pl.t?(Math.floor(pl.t/6)%2?SPR.r1:SPR.r2):SPR.idle;
  spr(fr,Math.round(pl.x-cam-6),Math.round(pl.y-16),pl.face<0,pl.x>SWX?'#41a6f6':'#b13e53');
  // snow
  if(f>0){x.fillStyle='#fff';x.globalAlpha=f;snow.forEach(s=>{s.y+=s.s;s.x-=s.s*.3;if(s.y>H){s.y=0;s.x=Math.random()*W}x.fillRect(Math.round(s.x),Math.round(s.y),1,1)});x.globalAlpha=1}
}
function hud(){const near=blocks.reduce((a,b,i)=>Math.abs(pl.x-b.x)<Math.abs(pl.x-blocks[a].x)?i:a,0),m=M[near];
  if(Math.abs(pl.x-blocks[near].x)<70){dlg.style.display='block';dlg.innerHTML=`<span class="pl">${m.y} · ${m.place}</span><br><b>${m.t}</b><br>${m.d}`}else dlg.style.display='none';
  score.textContent=`★ ${got}/8`;if(pl.x>60)hint.style.opacity=.4}
let last=performance.now();
(function loop(now){const k=Math.min(3,(now-last)/16.67);last=now;update(k);draw();hud();requestAnimationFrame(loop)})(last);
</script>
</body>
</html>
